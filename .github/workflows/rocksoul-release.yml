name: ROCKSOUL Production Release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - RELEASE_NOTES.md
      - .github/workflows/rocksoul-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rocksoul-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    if: github.repository == 'bjo163/gpt4free'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync production environment
        run: uv sync

      - name: Run deterministic regression suite
        run: uv run python -m unittest discover -s tests -v

      - name: Build wheel and source distribution
        run: uv build

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as fh:
              print(tomllib.load(fh)['project']['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create immutable version tag
        if: steps.release_state.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "ROCKSOUL $TAG production release"
            git push origin "$TAG"
          fi

      - name: Publish production GitHub release
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "ROCKSOUL $TAG" \
            --notes-file RELEASE_NOTES.md

      - name: Release already exists
        if: steps.release_state.outputs.exists == 'true'
        run: echo "Release ${{ steps.version.outputs.tag }} already exists; no duplicate release created."
